name: Push jam-actions dataset to HuggingFace

# Single-purpose workflow: push a dataset package under datasets/ to HuggingFace
# ONLY. Defaults remain the v0 public set so existing dispatch notes keep
# working. v1 is the same workflow with different inputs (dataset_dir +
# hf_repo_id). Use this for recovery when the main publish workflow's Zenodo
# half succeeded but the HF push failed (or to update an existing HF dataset
# without minting a new Zenodo deposit).
#
# Manual trigger only. Idempotent — if the HF repo already exists, this
# uploads a new revision; if not, it creates the repo first.
#
# Token (HF_TOKEN) comes from GitHub Secrets. Never echoed, never written.

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "HF dataset repo (namespace/name)"
        required: true
        default: "mcp-tool-shop/jam-actions-v0"
      commit_message:
        description: "HF commit message"
        required: false
        default: "Publish jam-actions-v0 v0.4.3"
      ref:
        description: "Git ref to push from"
        required: false
        default: "main"
      dataset_dir:
        description: "Which dataset package under datasets/ to push"
        required: false
        default: "datasets/jam-actions-v0-public"
      allow_card_overwrite:
        description: "Discard a card edited on HuggingFace (default: halt instead)"
        required: false
        default: "false"

concurrency:
  group: push-dataset-hf-${{ github.event.inputs.hf_repo_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Validate hf_repo_id input
        # The dispatch input is passed via env, never interpolated into the
        # shell body — a raw ${{ ... }} expansion here would let a crafted
        # input inject shell before the allowlist check runs.
        env:
          REPO_ID: ${{ github.event.inputs.hf_repo_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REPO_ID" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "ERROR: hf_repo_id must be namespace/name (got: $REPO_ID)"
            exit 1
          fi
          case "$REPO_ID" in
            mcp-tool-shop/*|mcp-tool-shop-org/*)
              echo "hf_repo_id OK: $REPO_ID"
              ;;
            *)
              echo "ERROR: hf_repo_id must start with 'mcp-tool-shop/' or 'mcp-tool-shop-org/' (got: $REPO_ID)"
              echo "This workflow is a narrowly-scoped recovery tool for this studio's datasets only."
              exit 1
              ;;
          esac

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify dataset package is intact
        run: |
          set -euo pipefail
          DIR="${{ github.event.inputs.dataset_dir }}"
          case "$DIR" in
            datasets/*) : ;;
            *) echo "ERROR: dataset_dir must be under datasets/ (got: $DIR)"; exit 1 ;;
          esac
          test -d "$DIR" || { echo "ERROR: no such dataset package: $DIR"; exit 1; }

          # Every package this workflow will push must carry these four. They are
          # what makes a drop reproducible and attributable by someone who only
          # ever sees the HuggingFace copy.
          test -f "$DIR/README.md"
          test -f "$DIR/VERSION"
          test -f "$DIR/records.jsonl"
          test -f "$DIR/checksums.sha256"

          VER=$(cat "$DIR/VERSION")
          echo "Pushing $DIR at version $VER"
          test -d "$DIR/records" && echo "  records/ ✓"

          # Checksums are the whole point of shipping them: verify before upload,
          # not after, so a corrupted or half-regenerated package never leaves.
          ( cd "$DIR" && sha256sum -c checksums.sha256 --quiet )             && echo "  checksums verify ✓"

      - name: Refuse to overwrite a card edited on HuggingFace
        # upload_folder replaces README.md with whatever is in the repo. A card
        # improved in the HuggingFace editor is therefore deleted by the next
        # dispatch, silently and with no diff anywhere.
        #
        # That is not hypothetical. On 2026-09-08 the live jam-actions-v0 card
        # was found to be a 69-line superset of the repo's -- a fine-tuning
        # evaluation banner and a "What's in a record" walkthrough that existed
        # nowhere else -- one dispatch away from being erased. Captured at
        # docs/hf-cards/.
        #
        # So: fetch the remote card first and halt when it differs. This is an
        # andon stop, not a policy. It never blocks the normal case, where the
        # repo is the only thing that edits the card.
        env:
          HF_REPO_ID: ${{ github.event.inputs.hf_repo_id }}
          DATASET_DIR: ${{ github.event.inputs.dataset_dir }}
          ALLOW_CARD_OVERWRITE: ${{ github.event.inputs.allow_card_overwrite }}
        run: |
          set -euo pipefail
          LOCAL="$DATASET_DIR/README.md"
          REMOTE_URL="https://huggingface.co/datasets/$HF_REPO_ID/raw/main/README.md"

          CODE=$(curl -sS -o /tmp/remote-card.md -w '%{http_code}' "$REMOTE_URL" || echo 000)

          # A dataset repo that does not exist yet answers 401, not 404 -- the
          # Hub cannot say "no such repo" without revealing whether a private one
          # exists. The push step creates the repo in exactly that case, so both
          # codes mean the same thing here: there is no card to protect. Treating
          # 401 as an error would have blocked every first push.
          case "$CODE" in
            404|401)
              echo "No readable card on HuggingFace (HTTP $CODE) — first push. Nothing to overwrite."
              exit 0
              ;;
            200) : ;;
            *)
              echo "ERROR: could not read the remote card (HTTP $CODE)."
              echo "Refusing to push blind. Re-run when HuggingFace is reachable."
              exit 1
              ;;
          esac

          if cmp -s /tmp/remote-card.md "$LOCAL"; then
            echo "Remote card matches the repo. Safe to push."
            exit 0
          fi

          echo "================================================================"
          echo "  HALT: the card on HuggingFace differs from this repo's."
          echo "================================================================"
          echo "  remote: $(wc -l < /tmp/remote-card.md) lines, $(wc -c < /tmp/remote-card.md) bytes"
          echo "  local:  $(wc -l < "$LOCAL") lines, $(wc -c < "$LOCAL") bytes"
          echo ""
          echo "  Lines the remote has that the repo does not:"
          diff "$LOCAL" /tmp/remote-card.md | grep '^>' | head -40 || true
          echo ""
          if [ "${ALLOW_CARD_OVERWRITE:-false}" = "true" ]; then
            echo "  allow_card_overwrite=true — proceeding, the remote card is discarded."
            exit 0
          fi
          echo "  Pushing now would DELETE the remote version of those lines."
          echo ""
          echo "  Either bring the remote card into the repo first, or re-run with"
          echo "  allow_card_overwrite=true if the repo's card is genuinely newer."
          exit 1

      - name: Install huggingface_hub
        run: pip install --quiet huggingface_hub

      - name: Push dataset to HuggingFace
        id: hf_push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ github.event.inputs.hf_repo_id }}
          HF_COMMIT_MSG: ${{ github.event.inputs.commit_message }}
          DATASET_DIR: ${{ github.event.inputs.dataset_dir }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "ERROR: HF_TOKEN secret is not set"
            exit 1
          fi
          python3 << 'PY'
          import os
          from huggingface_hub import HfApi
          from huggingface_hub.utils import RepositoryNotFoundError

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_REPO_ID"]
          commit_msg = os.environ["HF_COMMIT_MSG"]
          api = HfApi(token=token)

          try:
              api.repo_info(repo_id=repo_id, repo_type="dataset")
              print(f"HF repo already exists: {repo_id}")
          except RepositoryNotFoundError:
              api.create_repo(repo_id=repo_id, repo_type="dataset", private=False)
              print(f"Created HF dataset repo: {repo_id}")

          commit = api.upload_folder(
              folder_path=os.environ["DATASET_DIR"],
              repo_id=repo_id,
              repo_type="dataset",
              commit_message=commit_msg,
          )
          print(f"HF push commit: {commit}")
          print(f"HF URL: https://huggingface.co/datasets/{repo_id}")

          with open("/tmp/hf-url.txt", "w") as f:
              f.write(f"https://huggingface.co/datasets/{repo_id}\n")
          PY

          HF_URL=$(cat /tmp/hf-url.txt | tr -d '\n')
          echo "hf_url=$HF_URL" >> $GITHUB_OUTPUT

      - name: Print final receipt
        if: always()
        env:
          HF_REPO_ID: ${{ github.event.inputs.hf_repo_id }}
          HF_COMMIT_MSG: ${{ github.event.inputs.commit_message }}
          REF: ${{ github.event.inputs.ref }}
          HF_URL: ${{ steps.hf_push.outputs.hf_url }}
        run: |
          echo "================================================================"
          echo "  HuggingFace push receipt"
          echo "================================================================"
          echo "  HF repo:        $HF_REPO_ID"
          echo "  Commit message: $HF_COMMIT_MSG"
          echo "  Ref:            $REF"
          echo "  HF URL:         ${HF_URL:-(push failed)}"
          echo "================================================================"
