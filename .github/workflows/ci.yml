# --- Measured CI cost (dogfood-swarm SKILL item 8) --------------------------
# 33 billable min per push across 7 jobs (10.2 min actual wall time),
# measured 2026-09-09 from run 34380057331. Most expensive jobs:
#    11 min  ci (22)  (10.2 min wall)
#     9 min  ci (24)  (8.4 min wall)
#     9 min  Modern pnpm cold-start (pnpm 10, Node 22)  (8.6 min wall)
#     1 min  Docker image (library + journal volume)  (33 s wall)
# GitHub bills per JOB, rounded UP to the minute, x2 Windows / x10 macOS, so
# billable minutes exceed wall time — many short jobs cost more than one long
# one. This number is measured, never estimated; re-measure after any change:
#   gh api repos/mcp-tool-shop-org/ai-jam-sessions/actions/runs/<id>/jobs
# ---------------------------------------------------------------------------
name: CI

permissions:
  contents: read

on:
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "src/**"
      - "apps/**"
      - "scripts/**"
      # songs/library configs are shipped runtime data (package.json "files"),
      # validated by the registry, tests, and smoke — library edits must run
      # CI. Gap found 2026-07-10: a key-corrections PR drew no CI without this.
      - "songs/**"
      # datasets/** is live corpus that several src/dataset tests load
      # (schema-placeholder, midi-inspector, annotation-grounding,
      # package-public). Same class as the 2026-07-10 songs/** miss: a
      # corpus-only edit never started pnpm test. vitest.config.ts is the
      # coverage-floor config the Node-22 job enforces. samples/** ships
      # in the npm tarball and the Docker image.
      - "datasets/**"
      - "vitest.config.ts"
      - "samples/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "plugin/**"
      - ".github/workflows/**"
    branches: [main]
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "src/**"
      - "apps/**"
      - "scripts/**"
      - "songs/**"
      - "datasets/**"
      - "vitest.config.ts"
      - "samples/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "plugin/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Floor is 22: node-web-audio-api 2.0 (napi v3) requires Node >= 22,
        # and package.json's engines field matches. 24 covers current LTS —
        # the same line release.yml publishes from.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test with coverage
        if: matrix.node-version == 22
        # This job has ALREADY run the full suite uninstrumented in the step
        # above, engine verification included. Under V8 block coverage the
        # dataset's DSP verification -- 81 acoustic records each rendering a
        # take and running YIN and onset detection -- measured 10x slower
        # (build 22 s -> ~200 s; the two verification tests 11 s -> 166 s and
        # 110 s, on the studio rig; worse here). No timeout survives that, and
        # a 15-minute coverage leg is against the CI-minute rules. So this step
        # skips the engine block, which still runs on this job's plain Test step
        # and on the Node 24 job -- twice per push. The flag is named and the
        # test file says the same thing. See src/dataset/acoustic-v1/v1.test.ts.
        env:
          SKIP_DSP_VERIFICATION: "1"
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Build
        run: pnpm build

      - name: Smoke
        run: pnpm smoke

  # The main matrix installs via pnpm 10 (bumped from 9 on 2026-07-09 when
  # overrides moved to pnpm-workspace.yaml — pnpm 9 can't read them there and
  # fails frozen installs with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH). This job
  # keeps the cold-start + dependency-cache path covered on the same pnpm 10;
  # pnpm-workspace.yaml's keys were verified (coordinator, 2026-07) to install
  # cleanly under pnpm 11 too, so the next major bump is pre-validated.
  pnpm10-install:
    name: Modern pnpm cold-start (pnpm 10, Node 22)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Paths-gated with the workflow: Dockerfile, .dockerignore, docker-compose.yml,
  # src/**, and this file. Builds the image (no push). Asserts the shipped
  # library is 14 loaded / 94 unfetched, then proves a journal entry written
  # with AI_JAM_HOME on a named volume is readable from a second container.
  # No network fetch. Measured 2026-09-09 from run 34380057331:
  #     1 min  Docker image (library + journal volume)  (33 s wall)
  docker-image:
    name: Docker image (library + journal volume)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build image (no push)
        run: docker build -t ai-jam-sessions:ci .

      - name: Library is 14 loaded / 94 unfetched
        run: |
          set -euo pipefail
          STATS=$(docker run --rm --entrypoint node ai-jam-sessions:ci dist/cli.js stats)
          echo "$STATS"
          echo "$STATS" | grep -q 'Total songs: 14'
          LIB=$(docker run --rm --entrypoint node ai-jam-sessions:ci dist/cli.js library)
          echo "$LIB"
          echo "$LIB" | grep -q 'Not fetched: 94'

      - name: Journal survives a second container on the same volume
        run: |
          set -euo pipefail
          docker volume create ajs-ci-journal
          docker run --rm \
            -e AI_JAM_HOME=/data \
            -v ajs-ci-journal:/data \
            --entrypoint node \
            ai-jam-sessions:ci \
            --input-type=module \
            -e "import { appendJournalEntry } from './dist/journal.js'; const p = appendJournalEntry('ci journal proof\n'); console.log(p);"
          docker run --rm \
            -e AI_JAM_HOME=/data \
            -v ajs-ci-journal:/data \
            --entrypoint node \
            ai-jam-sessions:ci \
            --input-type=module \
            -e "import { readdirSync, readFileSync } from 'node:fs'; import { join } from 'node:path'; import { journalDir } from './dist/state-home.js'; const dir = journalDir(); const files = readdirSync(dir); const text = files.map((f) => readFileSync(join(dir, f), 'utf8')).join('\n'); if (!text.includes('ci journal proof')) { console.error('journal missing'); process.exit(1); } console.log('journal survived across containers:', files.join(', '));"
          docker volume rm ajs-ci-journal

  dep-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level critical

  plugin-validate:
    name: Validate plugin manifests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check plugin.json / marketplace.json version parity with package.json
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const plugin = JSON.parse(fs.readFileSync("plugin/.claude-plugin/plugin.json", "utf8"));
            const marketplace = JSON.parse(fs.readFileSync("plugin/.claude-plugin/marketplace.json", "utf8"));
            const mpVersion = marketplace.plugins && marketplace.plugins[0] && marketplace.plugins[0].version;
            const errors = [];
            if (plugin.version !== pkg.version) {
              errors.push("plugin.json version (" + plugin.version + ") != package.json version (" + pkg.version + ")");
            }
            if (mpVersion !== pkg.version) {
              errors.push("marketplace.json plugins[0].version (" + mpVersion + ") != package.json version (" + pkg.version + ")");
            }
            if (errors.length) {
              console.error("Plugin manifest drift detected:");
              for (const e of errors) console.error(" - " + e);
              process.exit(1);
            }
            console.log("Plugin manifests match package.json version " + pkg.version);
          '

  # apps/cockpit is a standalone Vite/TS app, deliberately NOT a pnpm
  # workspace member (pnpm-workspace.yaml's `packages` list is just "." —
  # see that file's own comment) and has no pnpm-lock.yaml of its own (only
  # a legacy package-lock.json) — so this job installs/typechecks/builds it
  # in isolation rather than folding it into the root `ci` job's
  # `pnpm install --frozen-lockfile` (which only ever touches the root
  # lockfile). No dependency caching here: with no pnpm-lock.yaml to hash,
  # actions/setup-node's `cache: pnpm` has nothing reliable to key off for
  # this directory, and the install here is small/fast enough that it isn't
  # worth the risk of a cache-resolution edge case failing the job.
  cockpit:
    name: Cockpit app (typecheck + build)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install cockpit dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
